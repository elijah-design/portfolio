<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Elijah — Portfolio Viewer</title>

  <!-- Fonts + Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Montserrat:wght@100;300;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Your CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- Provide the PDF URL to the app (override if you want) -->
  <script>
    window.PDF_URL = window.PDF_URL || "https://elijah-design.github.io/portfolio/assets/pdf/portfolio.pdf";
  </script>

  <!-- PDF.js (must load before app.js) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Your app (must load AFTER pdf.min.js) -->
  <script defer src="assets/js/app.js"></script>
</head>

<body>
  <!-- ======= HEADER ======= -->
  <header class="site-header">
    <div class="header-inner">
      <a href="https://www.elijah-design.com" class="brand fade-in" style="--delay:.1s">
        <img class="logo" loading="lazy"
          src="https://drive.google.com/thumbnail?id=1NhRACGH1UPU_V0Buuc-O02R7ffjXvAOv&sz=w1000"
          alt="Elijah Design">
      </a>

      <div class="divider"></div>

      <a href="https://www.elijah-design.com/about" class="nav-link fade-in" style="--delay:.6s">
        <h1>ABOUT</h1>
      </a>

      <div class="social-icons">
        <a href="https://ca.linkedin.com/in/elijah-design" target="_blank" aria-label="LinkedIn" rel="noopener">
          <i class="fab fa-linkedin fade-in" style="--delay:.6s"></i>
        </a>
        <a href="https://www.instagram.com/elijahdesign/" target="_blank" aria-label="Instagram" rel="noopener">
          <i class="fab fa-instagram fade-in" style="--delay:.8s"></i>
        </a>
        <a href="mailto:designs.elijah@gmail.com" aria-label="Email">
          <i class="fas fa-envelope fade-in" style="--delay:1s"></i>
        </a>
        <a href="https://www.youtube.com/@elijah-design/videos" target="_blank" aria-label="YouTube" rel="noopener">
          <i class="fab fa-youtube fade-in" style="--delay:1.2s"></i>
        </a>
      </div>

      <a class="download-btn fade-in" style="--delay:1.4s"
        href="https://drive.google.com/file/d/1ts78iAFuajxSzBSuq11J5YVyxrlnbdsf/view?usp=sharing" target="_blank"
        rel="noopener">🔒 DOWNLOAD PORTFOLIO</a>
    </div>
  </header>

  <!-- ======= VIEWER ======= -->
  <section class="viewer-shell" role="main">
    <!-- TOOLBAR -->
    <div class="toolbar" id="toolbar">
      <!-- sliding left dock -->
      <div class="left-dock">
        <button id="outlineBtn" class="btn" title="Table of Contents" aria-expanded="false">
          <i class="fa-solid fa-list-ul"></i>
        </button>
        <button id="thumbsToggle" class="btn" title="Pages" aria-expanded="false">
          <i class="fa-regular fa-file fa-1.5x"></i>
        </button>
      </div>

      <!-- NAV -->
      <div class="group">
        <button id="prev" class="btn" title="Previous (←)" aria-label="Previous">◀</button>
        <div class="label" aria-live="polite"><span id="pageNum">—</span>/<span id="pageCount">—</span></div>
        <button id="next" class="btn" title="Next (→)" aria-label="Next">▶</button>
      </div>

      <div class="spacer"></div>

      <div class="group">
        <button id="fitW" class="btn" title="Fit width"><i class="fa-solid fa-arrows-left-right-to-line"></i></button>
        <button id="fitP" class="btn" title="Fit page"><i class="fa-solid fa-maximize"></i></button>
      </div>

      <div class="group">
        <button id="zoomOut" class="btn" title="Zoom out" aria-label="Zoom out">
          <i class="fa fa-search-minus fa-1.5x"></i>
        </button>
        <div id="zoomLbl" class="label">100%</div>
        <button id="zoomIn" class="btn" title="Zoom in" aria-label="Zoom in">
          <i class="fa fa-search-plus fa-1.5x"></i>
        </button>

        <select id="preset" class="select" title="Zoom preset" aria-label="Zoom preset">
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
          <option value="3">300%</option>
          <option value="4">400%</option>
        </select>

        <button id="center" class="btn" title="Center" aria-label="Center">
          <i class="fa-solid fa-crosshairs"></i>
        </button>
      </div>
    </div>

    <!-- Left panels -->
    <aside class="left-dock-panels">
      <div id="outlinePanel" class="dock-panel" aria-hidden="true">
        <h3>Contents</h3>
        <ul id="outlineList" class="outline-list"></ul>
      </div>

      <div id="thumbsPanel" class="dock-panel" aria-hidden="true">
        <div id="thumbs" class="thumbs-list"></div>
      </div>
    </aside>

    <!-- Viewer area -->
    <div id="viewer" class="viewer">
      <div id="stage" class="stage">
        <div id="spread" class="spread"></div>
      </div>
    </div>

    <!-- Bottom / overlays -->
    <div class="bottom-bar">
      <div class="info">Tip: use mouse wheel + Ctrl to zoom, drag to pan, ← → to navigate</div>
    </div>
  </section>

  <noscript>
    <div class="no-js-warning">This viewer requires JavaScript. Please enable JavaScript in your browser.</div>
  </noscript>
</body>
</html>
